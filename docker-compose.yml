services:
  forest_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forest_assistant_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/forest_bot.db
      - FOREST_ARCHIVE_PATH=/app/forest_archive
    volumes:
      - ./data:/app/data
